*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:radial-gradient(circle at 15% -10%,#182235 0,#080a0f 34%,#080a0f 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif}
.wrap{max-width:1580px;margin:auto;padding:18px 18px 48px}.header{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}h1{font-size:27px;margin:0 0 4px;letter-spacing:.01em}.subtitle{margin:0;color:var(--muted);font-size:11.5px}.summary{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:#111722;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:800;color:#d8dfeb}

.section{margin-top:14px}.section-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}.section-head h2{margin:0;font-size:17px}.count{font-size:11px;font-weight:850;background:#1b2230;border:1px solid #2d3749;border-radius:999px;padding:3px 8px;color:#aeb9cb}.mark{width:7px;height:27px;border-radius:99px}.mark-playing{background:#39d27c}.mark-wait{background:#ffb44d}.mark-purchase{background:#ff5e7b}.mark-conditional{background:#718bff}.mark-interest{background:#7695b8}.mark-retry{background:#ad78ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:10px}.card{height:166px;display:grid;grid-template-columns:58% 42%;background:linear-gradient(180deg,#151a23,#10141b);border:1px solid #272f3d;border-radius:13px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,.18);cursor:pointer;transition:.16s ease;min-width:0}.card:hover{transform:translateY(-2px);border-color:#4a5870;box-shadow:0 12px 28px rgba(0,0,0,.36)}.cover{grid-column:2;grid-row:1;width:100%;height:100%;background:#0d1118;overflow:hidden;position:relative;border-left:1px solid #252d3a}.cover:after{content:"";position:absolute;inset:0 auto 0 0;width:16px;z-index:3;pointer-events:none;background:linear-gradient(90deg,rgba(16,20,27,.55),transparent)}.cover::before{content:"";position:absolute;inset:-10px;z-index:0;background-image:var(--cover-bg);background-size:cover;background-position:center;filter:blur(12px) brightness(.42) saturate(.9);transform:scale(1.12);opacity:.95}.cover img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;position:relative;z-index:2;background:transparent;padding:2px;transition:.15s ease}.cover.portrait::before{opacity:.18;filter:blur(10px) brightness(.34) saturate(.88)}.cover.portrait img{object-fit:cover;object-position:center 52%;padding:0}.cover.portrait.package img{object-position:center 60%}.cover.portrait .cover-fallback{display:none!important}.cover.square::before{opacity:.32;filter:blur(10px) brightness(.38) saturate(.92)}.cover.square img{object-fit:cover;object-position:center;padding:0}.cover-fallback{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:12px;font-weight:900;color:#758197;background:linear-gradient(135deg,#151b25,#0d1118)}.card-body{grid-column:1;grid-row:1;padding:12px 11px 11px;display:flex;flex-direction:column;justify-content:center;min-width:0}.title{font-size:16.5px;font-weight:950;line-height:1.22;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 6px;font-size:9.3px;font-weight:850;background:#242d3c;color:#d3dbe8;border:1px solid #303b4e}.badge.platform{background:#132d52;color:#a9ccff;border-color:#234b81}.badge.tag{background:#133426;color:#9ee4bf;border-color:#245b42}.meta{font-size:10.2px;line-height:1.35;color:#aab4c4;min-height:0;overflow:hidden}.meta-row{margin-top:4px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.meta-row:first-child{margin-top:0}.meta-row.release-row{-webkit-line-clamp:1;color:#8fa0b8}.meta-row.condition-row{-webkit-line-clamp:2}.meta-row.memo-row{-webkit-line-clamp:2}.meta-label{font-weight:850;color:#d4dbe7}.clickhint{margin-top:5px;font-size:9px;color:#6f7a8c}
.empty{border:1px dashed #3b4659;background:#11151d;border-radius:13px;padding:22px;color:#8995a8}footer{text-align:center;color:#687487;font-size:11px;margin-top:28px}

const sectionOrder=['プレイ中','プレイ待機','購入待機','条件次第','関心','再挑戦候補'];
const explains=[
 ['関心','名前は残しておきたい段階。買ってまで積極的には遊ばないが、無料・カタログ入り・かなり安いセールなどなら遊ぶかもしれない。'],
 ['条件次第','やってみたい気持ちはある。価格・評判・時間など、自分に合う条件が揃えば購入・プレイする。'],
 ['購入待機','いずれ必ず遊ぶつもりで、買う意思も固まっている。セールや他ゲームとの兼ね合いなど、購入タイミングだけを待っている。'],
 ['プレイ待機','すでに入手済み、または遊べる状態。別ゲームを優先中、アップデート待ち、復帰待ちなど。'],
 ['プレイ中','現在プレイしているゲーム。']
];
const markClass={'プレイ中':'mark-playing','プレイ待機':'mark-wait','購入待機':'mark-purchase','条件次第':'mark-conditional','関心':'mark-interest','再挑戦候補':'mark-retry'};
let stateFilter='all',genreFilter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setupFlow(){document.getElementById('flow').innerHTML=explains.map(([n,d])=>`<div class="flow-item"><strong>${esc(n)}</strong><span>${esc(d)}</span></div>`).join('')}
function isPackageUrl(url){
 const s=String(url||'').toLowerCase();
 return ['walmartimages.com','fnac-static.com','pacn.ws','limitedrungames.com','mobibus.gr','shop.r10s.jp','eb-cdn.com.au','librephonia.com','bestbuy','nfm.com'].some(x=>s.includes(x));
}
function displayUrls(g){
 const all=(g.images||[]).filter(Boolean);
 const clean=all.filter(u=>!isPackageUrl(u));
 return clean.length?clean:all;
}
function setImg(img,g,idx=0){
 const urls=displayUrls(g);
 const p=img.parentElement;
 if(p&&p.classList.contains('cover')){p.classList.remove('portrait','landscape','square','package');}
 if(idx>=urls.length){img.style.display='none';if(p&&p.classList.contains('cover'))p.style.removeProperty('--cover-bg');return}
 const url=urls[idx];
 img.style.display='block';
 img.onload=()=>{
   const fb=p&&p.querySelector('.cover-fallback');if(fb)fb.style.display='none';
   if(p&&p.classList.contains('cover')){
     p.style.setProperty('--cover-bg',`url("${img.currentSrc||img.src}")`);
     const ratio=(img.naturalHeight||1)/(img.naturalWidth||1);
     const portrait=ratio>1.12;
     const square=ratio>=0.84&&ratio<=1.12;
     p.classList.toggle('portrait',portrait);
     p.classList.toggle('square',square);
     p.classList.toggle('landscape',!portrait&&!square);
   }
 };
 img.src=url;
 img.onerror=()=>{const fb=p&&p.querySelector('.cover-fallback');if(fb)fb.style.display='flex';setImg(img,g,idx+1)};
}
function matchesGenre(g){return genreFilter==='all'||(g.genreTags||[]).includes(genreFilter)}
function shortRelease(s){
 const t=String(s||'').trim();
 if(!t)return '';
 const m=t.match(/^(\d{4})年(\d{1,2})月(?:\d{1,2}日)?(.*)$/);
 if(m)return `${m[1]}年${m[2]}月${m[3]||''}`;
 return t;
}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const filtered=games.filter(g=>(stateFilter==='all'||g.state===stateFilter)&&matchesGenre(g)&&(!q||[g.name,g.state,g.platform,g.condition,g.memo,g.genre,g.desc,g.release,g.tag,...(g.genreTags||[])].join(' ').toLowerCase().includes(q)));
 document.getElementById('summary').innerHTML=sectionOrder.map(s=>`<span class="pill">${esc(s)} ${games.filter(g=>g.state===s).length}</span>`).join('');
 const app=document.getElementById('app'); app.innerHTML='';
 sectionOrder.forEach(state=>{
   const list=filtered.filter(g=>g.state===state); if(!list.length)return;
   const sec=document.createElement('section'); sec.className='section';
   sec.innerHTML=`<div class="section-head"><span class="mark ${markClass[state]}"></span><h2>${esc(state)}</h2><span class="count">${list.length}</span></div><div class="grid"></div>`;
   const grid=sec.querySelector('.grid');
   list.forEach(g=>{
     const c=document.createElement('article');c.className='card';c.tabIndex=0;
     const metas=[
       g.release?`<div class="meta-row release-row"><span class="meta-label">発売：</span>${esc(shortRelease(g.release))}</div>`:'',
       g.condition?`<div class="meta-row condition-row"><span class="meta-label">買う条件：</span>${esc(g.condition)}</div>`:'',
       g.memo?`<div class="meta-row memo-row"><span class="meta-label">メモ：</span>${esc(g.memo)}</div>`:''
     ].join('');
     c.innerHTML=`<div class="cover"><img alt="${esc(g.name)}" loading="lazy"><div class="cover-fallback">${esc(g.name)}</div></div><div class="card-body"><div class="title">${esc(g.name)}</div><div class="badges">${g.platform?`<span class="badge platform">${esc(g.platform)}</span>`:''}${g.tag?`<span class="badge tag">${esc(g.tag)}</span>`:''}</div><div class="meta">${metas||'<span style="color:#667387">情報なし</span>'}</div></div>`;
     const img=c.querySelector('img');setImg(img,g);
     c.addEventListener('click',()=>openModal(g));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(g)}});grid.appendChild(c);
   }); app.appendChild(sec);
 });
 if(!filtered.length)app.innerHTML='<div class="empty">該当するゲームはありません。</div>';
}
function openModal(g){
 document.getElementById('mtitle').textContent=g.name;document.getElementById('mrelease').textContent=g.release||'未登録';document.getElementById('mgenre').textContent=g.genre||'—';document.getElementById('mdesc').textContent=g.desc||'説明未登録';
 document.getElementById('mgenreTags').innerHTML=(g.genreTags||[]).map(x=>`<span class="genre-chip">${esc(x)}</span>`).join('');
 const img=document.getElementById('mimg');setImg(img,g);document.getElementById('mbadges').innerHTML=`<span class="badge">${esc(g.state)}</span>${g.platform?`<span class="badge platform">${esc(g.platform)}</span>`:''}${g.tag?`<span class="badge tag">${esc(g.tag)}</span>`:''}`;
 const cb=document.getElementById('mconditionBlock'),mb=document.getElementById('mmemoBlock');cb.style.display=g.condition?'block':'none';mb.style.display=g.memo?'block':'none';document.getElementById('mcondition').textContent=g.condition||'';document.getElementById('mmemo').textContent=g.memo||'';
 const a=document.getElementById('msource');a.href=g.source||'#';a.style.display=g.source?'inline-block':'none';const modal=document.getElementById('modal');modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
function closeModal(){const m=document.getElementById('modal');m.classList.remove('open');m.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',closeModal));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('search').addEventListener('input',render);document.getElementById('genreFilter').addEventListener('change',e=>{genreFilter=e.target.value;render()});document.querySelectorAll('.toolbar button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');stateFilter=b.dataset.state;render()}));
setupFlow();render();
</script></body></html>
